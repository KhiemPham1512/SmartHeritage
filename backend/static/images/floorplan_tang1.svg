<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Sơ đồ mặt bằng Tầng 1 (minh họa). Hệ tọa độ = pixel, gốc (0,0) ở góc trên trái; 26 px ≈ 1 m.
       Vị trí 5 beacon mẫu: BC-001 (340,215) · BC-002 (520,180) · BC-003 (280,420) · BC-004 (410,310) · BC-005 (610,450).
       Xuất PNG (cùng thư mục) bằng Edge headless 900x600 khi sửa file này. -->
  <rect width="900" height="600" fill="#f8f4ec"/>
  <g fill="#f1e7d6" stroke="#c4b496" stroke-width="3">
    <rect x="20" y="20" width="450" height="330" rx="3"/>
    <rect x="490" y="20" width="390" height="330" rx="3"/>
    <rect x="20" y="380" width="430" height="170" rx="3"/>
    <rect x="470" y="380" width="410" height="170" rx="3"/>
  </g>
  <!-- tủ trưng bày -->
  <g fill="#e6d8bd" stroke="#cdbd9e" stroke-width="1.5">
    <rect x="70" y="170" width="110" height="60" rx="2"/>
    <rect x="230" y="110" width="120" height="50" rx="2"/>
    <rect x="60" y="270" width="130" height="45" rx="2"/>
    <rect x="530" y="110" width="80" height="90" rx="2"/>
    <rect x="720" y="110" width="80" height="90" rx="2"/>
    <rect x="60" y="440" width="90" height="70" rx="2"/>
    <rect x="350" y="450" width="70" height="70" rx="2"/>
    <rect x="500" y="450" width="70" height="70" rx="2"/>
    <rect x="750" y="440" width="90" height="70" rx="2"/>
  </g>
  <g fill="#7a6a4f" font-size="15" font-weight="600" letter-spacing="0.5">
    <text x="40" y="52">PHÒNG ĐÔNG SƠN</text>
    <text x="510" y="52">PHÒNG GỐM VIỆT</text>
    <text x="40" y="412">PHÒNG CHĂM PA</text>
    <text x="490" y="412">PHÒNG TRIỀU NGUYỄN</text>
  </g>
  <g fill="#a39577" font-size="11.5">
    <text x="40" y="70">Đồng cổ &amp; đời sống Việt cổ</text>
    <text x="510" y="70">Gốm sứ qua các thời kỳ</text>
    <text x="40" y="430">Điêu khắc &amp; kiến trúc</text>
    <text x="490" y="430">Cổ vật cung đình</text>
  </g>
  <text x="450" y="368" text-anchor="middle" fill="#8f8160" font-size="13" font-weight="600" letter-spacing="1">SẢNH CHÍNH</text>
  <!-- lối vào -->
  <g fill="#8b3a2e" font-size="13" font-weight="600">
    <path d="M450 586 L450 562 M441 572 L450 561 L459 572" stroke="#8b3a2e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="468" y="580">Lối vào</text>
  </g>
  <!-- thước tỷ lệ: 5 m = 130 px -->
  <g stroke="#7a6a4f" stroke-width="2.5" fill="#7a6a4f" font-size="12">
    <line x1="24" y1="580" x2="154" y2="580"/>
    <line x1="24" y1="574" x2="24" y2="586"/>
    <line x1="154" y1="574" x2="154" y2="586"/>
    <text x="164" y="584" stroke="none">5 m</text>
  </g>
</svg>
